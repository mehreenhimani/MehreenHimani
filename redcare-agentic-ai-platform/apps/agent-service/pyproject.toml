[project]
name = "carecopilot-agent"
version = "1.4.0"
description = "Reference agent on the Redcare Agentic AI Platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
  "S101",  # pytest needs assert
  "B008",  # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"app/tools/pharmacy.py" = ["S324"]  # sha256 here is an id, not a security primitive

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
