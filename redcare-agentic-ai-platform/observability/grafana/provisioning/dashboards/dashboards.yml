apiVersion: 1
providers:
  - name: platform
    folder: Agentic AI Platform
    type: file
    disableDeletion: true
    # Dashboards live in Git and are provisioned. A dashboard edited in the UI and
    # never committed is a dashboard that disappears with the container.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
