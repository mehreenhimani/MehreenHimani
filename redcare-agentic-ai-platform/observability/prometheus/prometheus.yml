global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: redcare-agentic-ai
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: carecopilot-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:8080"]
        labels: { service: carecopilot-agent, tenant: pharmacy-care }

  - job_name: litellm-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]
        labels: { service: litellm-gateway }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
